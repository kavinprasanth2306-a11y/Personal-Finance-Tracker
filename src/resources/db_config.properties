# =====================================================================
# Database Configuration for Personal Finance Tracker
# Supported database types: SQLITE or MYSQL
# =====================================================================
database.type=SQLITE

# SQLite Configuration (Default: zero-config, portable embedded database)
sqlite.db.path=finance_tracker.db

# MySQL Configuration (Optional: for client-server relational setups)
mysql.host=localhost
mysql.port=3306
mysql.database=finance_tracker
mysql.username=root
mysql.password=root
mysql.useSSL=false
mysql.serverTimezone=UTC
mysql.allowPublicKeyRetrieval=true
